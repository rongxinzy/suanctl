[package]
name = "suanctl"
version = "0.1.0"
edition = "2021"
description = "Chinese-first read-only diagnostics and monitoring TUI for AI compute servers"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time"] }
wait-timeout = "0.2"
